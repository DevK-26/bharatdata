source_url: https://data.gov.in/   # TODO_VERIFY exact catalogue page
format: json
refresh_cron: "0 3 1 * *"   # monthly (static-ish), 1st at 03:00 UTC
expected_schema:
  circlename: string
  regionname: string
  divisionname: string
  officename: string
  pincode: string
  officetype: string
  delivery: string
  district: string
  statename: string
  latitude: float
