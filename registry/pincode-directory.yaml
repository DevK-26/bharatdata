slug: pincode-directory
title: India Pincode Directory
description: >-
  Every post office in India with its six-digit pincode, district, state,
  postal circle, region and division, and whether it delivers mail. Use it to
  look up where a pincode is or which pincodes a district has.
sector: postal
ministry: Ministry of Communications (Department of Posts)
source_type: api
resource_id: null
