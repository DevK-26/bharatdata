[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bharatdata"
dynamic = ["version"]
description = "BharatData — Government of India open data, cleaned, versioned, and republished as dataset pages + a free public API."
readme = "README.md"
# Developed and tested on Python 3.12 only (the same version the Docker image uses).
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0,<7",
    "pydantic>=2.5,<3",
    "requests>=2.31,<3",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "celery[redis]>=5.4,<6",
    "psycopg2-binary>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "responses>=0.25,<1",
    "httpx>=0.27,<1",
    "pglast>=7,<9",
    "freezegun>=1.5,<2",
    "pgserver>=0.1.4,<1",
]

[tool.setuptools.dynamic]
# Single source of truth for the version: src/bharatdata/__init__.py
version = { attr = "bharatdata.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
